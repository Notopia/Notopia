<!DOCTYPE html>
<html lang="fa">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#ffb638">
    <title>Notopia</title>
    <link rel="stylesheet" href="/Styles/output.css">
    <link rel="stylesheet" href="/Header/Header.css" />
    <link rel="icon" href="/images/icon.webp" type="image/x-image" />
</head>

<body class="m-0 overflow-x-hidden bg-[#141414] flex flex-col justify-center items-center min-h-screen" onscroll="CloseDropdown()" onload="HideLoading()">
    <div class="loading__container">
        <div class="loading">
            <lottie-player autoplay loop mode="normal" src="/Animations/Loading.json" style="width: 220px">
            </lottie-player>
        </div>
    </div>
    <header class="mt-8 w-full text-center">
        <img class="fixed top-2 sm:top-3 xl:top-5 right-1 sm:right-3 xl:right-6 w-16 sm:w-22 xl:w-30" src="/images/icon.webp" alt="Notopia">
        <p class="text-xl md:text-2xl xl:text-3xl text-white animate-pulse m-0 my-6">!مسیر یادگیری‌ات را بساز</p>
    </header>
    <main>
        <section id="content">
            <div class="w-full mt-24">
                <div dir="rtl" class="leading-7 mx-auto px-3 space-y-8">
                    <div class="bg-white px-2 md:px-4 lg:px-8 py-3 md:py-6 rounded-xl flex flex-col gap-1 md:gap-2 sm:w-110 lg:w-140">
                        <h2 class="text-center font-bold text-xl md:text-2xl">به نوتوپیا خوش آمدی</h2>
                        <p class="m-0 lg:text-lg">اینجا قرار است دنیای موسیقی را به شیوه خودت کشف کنی.</p>
                        <p class="m-0 lg:text-lg">فرقی نمی‌کند تازه شروع کرده باشی یا سال‌ها موسیقی کار کرده باشی؛ نوتوپیا به تو
                            کمک می‌کند
                            مسیر مناسب خودت را پیدا کنی.</p>
                        <p class="m-0 lg:text-lg">چند سؤال کوتاه داریم تا بهتر بشناسیمت.</p>
                    </div>
                    <div class="text-center">
                        <button
                            class="text-lg lg:text-xl px-3 sm:px-5 md:px-8 lg:px-8 py-1 md:py-1.5 border-2 ring-white rounded-xl md:rounded-2xl outline-none mb-34 cursor-pointer hover:scale-105 ring-2 focus:ring-6 ring-offset-0 border-none transition-all bg-main"
                            id="1to2">بزن بریم!</button>
                    </div>
                </div>
            </div>
        </section>
    </main>
</body>
<script src="/Header/Header.js"></script>
<script src="/Dependencies/lottie-player.js"></script>
<script type="module" src="/get-started/get-started.js"></script>

</html>
